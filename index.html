<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec">
<title>Furnifold · Room planner</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<header class="top">
  <a href="./" class="brand"><span class="mark" aria-hidden="true"></span>Furnifold</a>
  <div class="top-actions"><span id="save" role="status"></span><button id="new-room" class="button primary">＋ New room</button></div>
</header>
<main>
  <div class="hero"><div><div class="eyebrow">ROOM PLANNER</div><h1 id="room-name"></h1><p id="room-details"></p></div><button id="sample" class="button">Open sample bedroom</button></div>
  <section class="studio" aria-label="Room editor">
    <aside class="left panel">
      <div class="section-heading"><h2>Layouts</h2><button id="duplicate" class="icon" aria-label="Duplicate layout" title="Duplicate layout">＋</button></div>
      <div id="layouts"></div>
      <div class="library"><h2>Furniture</h2><p>Add to this layout</p><div id="catalog"></div><button class="button full" id="custom">＋ Custom item</button></div>
    </aside>
    <section class="canvas-panel">
      <div class="toolbar"><div class="segments" aria-label="View"><button data-view="Plan">Plan</button><button data-view="Furnished">Furnished</button><button data-view="Compare">Compare</button></div>
      <div class="tool-actions"><button id="undo" class="icon" title="Undo" aria-label="Undo">↶</button><button id="redo" class="icon" title="Redo" aria-label="Redo">↷</button><label class="sr-only" for="units">Units</label><select id="units"><option value="cm">cm</option><option value="in">in</option></select></div></div>
      <div id="canvas"></div>
      <footer class="canvas-footer"><span id="hint"></span><button id="edit-room" class="link">Room dimensions</button></footer>
    </section>
    <aside class="right panel">
      <div id="inspector"></div>
      <div class="checks"><div class="section-heading"><h2>Fit checks</h2><span id="issue-count"></span></div><div id="checks"></div></div>
    </aside>
  </section>
</main>
<dialog id="dialog"></dialog>
<script type="module" src="./src/editor.mjs"></script>
</body>
</html>
